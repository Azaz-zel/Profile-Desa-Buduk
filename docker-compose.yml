services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: desa_buduk
      MYSQL_USER: buduk
      MYSQL_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di file .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?isi DB_ROOT_PASSWORD di file .env}
    volumes: [db:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: mysql://buduk:${DB_PASSWORD}@db:3306/desa_buduk
      JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET minimal 32 karakter}
      # https di depan (Nginx/Caddy/Cloudflare): cookie hanya lewat https, IP asli dari proxy
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    ports: ["127.0.0.1:3000:3000"]
    volumes: [files:/data]

volumes:
  db:
  files:
